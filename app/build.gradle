plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "com.codex.doubaomictracker"
    compileSdk 35

    defaultConfig {
        applicationId "com.codex.doubaomictracker"
        minSdk 29
        targetSdk 35
        versionCode 33
        versionName "3.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        stableRelease {
            if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.stableRelease
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.10'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
